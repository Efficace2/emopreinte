<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Émopreinte - votre empreinte émotionnelle</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2348235C%22/%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2220%22%20r%3D%228%22%20fill%3D%22%23e94e1b%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2248%22%20font-family%3D%22Open%20Sans%2CArial%2Csans-serif%22%20font-size%3D%2234%22%20font-weight%3D%22800%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3E%C3%A9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#48235C; --violet-mid:#8e5fa8; --violet-soft:#efe9f3;
  --orange:#e94e1b; --gris:#6f6b78; --gris-soft:#f4f3f6;
  --ink:#2c2433; --line:#e4e0e8; --bg:#faf9fb;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Open Sans',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:0 20px 64px}
.topbar{background:var(--violet);padding:16px 20px;display:flex;align-items:center;gap:14px}
.topbar svg{height:30px;width:auto}
.topbar .bl{color:#fff;opacity:.85;font-size:12.5px;letter-spacing:.04em;font-weight:600}
h1{font-size:26px;line-height:1.2;margin:28px 0 6px;color:var(--violet);font-weight:800}
h2{font-size:19px;color:var(--violet);font-weight:800;margin:34px 0 10px}
h3{font-size:15.5px;font-weight:700;margin:18px 0 6px}
p.lead{font-size:16px;color:#4a4254;margin:6px 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0;
  box-shadow:0 1px 2px rgba(72,35,92,.04)}
.btn{appearance:none;border:0;border-radius:10px;padding:13px 22px;font-family:inherit;font-size:15px;
  font-weight:700;cursor:pointer;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{filter:brightness(.95)}
.btn-violet{background:var(--violet);color:#fff}
.btn-violet:hover{filter:brightness(1.1)}
.btn-ghost{background:#fff;color:var(--violet);border:1.5px solid var(--violet)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.choice-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:560px){.choice-cards{grid-template-columns:1fr}}
.choice{border:1.5px solid var(--line);border-radius:14px;padding:22px;cursor:pointer;background:#fff;text-align:left;transition:.15s}
.choice:hover{border-color:var(--violet);box-shadow:0 4px 14px rgba(72,35,92,.08)}
.choice .ic{font-size:26px}
.choice b{display:block;color:var(--violet);font-size:16px;margin:8px 0 4px;font-weight:800}
.choice span{color:#6a6175;font-size:13.5px}
/* quiz */
.scale-head{display:flex;align-items:center;gap:10px;margin:30px 0 6px}
.scale-dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.scale-head b{font-size:17px;font-weight:800}
.qitem{padding:16px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qtext{font-size:15px;margin-bottom:10px}
.scale-row{display:flex;gap:7px;flex-wrap:wrap}
.opt{flex:1 1 0;min-width:64px;border:1.5px solid var(--line);background:#fff;border-radius:9px;
  padding:9px 4px;text-align:center;cursor:pointer;font-size:11.5px;color:#6a6175;line-height:1.25;transition:.12s}
.opt b{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}
.opt:hover{border-color:var(--violet-mid)}
.opt.sel{background:var(--violet);border-color:var(--violet);color:#fff}
.opt.sel b{color:#fff}
.progress{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--line)}
.pbar{height:8px;background:var(--violet-soft);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orange);width:0;transition:.25s}
.pcount{font-size:13px;color:#6a6175;margin-top:6px}
/* code result */
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;font-weight:700;letter-spacing:.06em;
  color:var(--violet);background:var(--violet-soft);border:1.5px dashed var(--violet-mid);border-radius:12px;
  padding:18px;text-align:center;word-break:break-all}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;padding:12px;
  border:1.5px solid var(--line);border-radius:10px;resize:vertical;min-height:70px}
input.txt{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%}
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:700;color:var(--violet);margin-bottom:5px}
.err{color:var(--orange);font-weight:700;font-size:14px;margin-top:8px}
/* report */
.report-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  border-bottom:3px solid var(--orange);padding-bottom:14px;margin-bottom:6px}
.report-head svg{height:34px}
.report-head .meta{text-align:right;font-size:13px;color:#6a6175}
.report-head .meta b{color:var(--violet);font-size:15px}
.global{display:flex;align-items:center;gap:18px;background:var(--violet);color:#fff;border-radius:14px;padding:18px 22px;margin:18px 0}
.global .num{font-size:40px;font-weight:800;line-height:1}
.global .lbl{font-size:13px;opacity:.85}
.global .bd{font-size:18px;font-weight:800}
.radar{width:100%;height:auto;display:block;margin:6px auto}
.genrow{padding:12px 0;border-bottom:1px solid var(--line)}
.genrow:last-child{border-bottom:0}
.genrow .gh{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.genrow .gh b{font-weight:800}
.genrow .gh .pill{margin-left:auto;font-size:12px;font-weight:700;color:#fff;border-radius:20px;padding:3px 11px}
.bars .bgroup{margin:14px 0}
.bars .bgh{font-weight:800;font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.bar{display:grid;grid-template-columns:1fr;gap:3px;margin:7px 0}
.bar .bl{font-size:13px;color:#4a4254}
.bar .track{height:16px;background:var(--gris-soft);border-radius:8px;position:relative;overflow:hidden}
.bar .fill{height:100%;border-radius:8px}
.bar .bv{font-size:12px;font-weight:700;color:#6a6175;margin-left:6px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tag{font-size:12.5px;font-weight:700;border-radius:8px;padding:10px 12px;margin:8px 0;
  display:flex;gap:9px;align-items:flex-start}
.tag.f{background:#f1f7ef;border-left:4px solid #5a8f3c}
.tag.a{background:#fff3ec;border-left:4px solid var(--orange)}
.tag .nm{color:var(--violet);font-weight:800;white-space:nowrap}
.actions-list{margin:6px 0 2px;padding-left:18px}
.actions-list li{margin:4px 0;font-size:13.5px}
[contenteditable=true]:focus{outline:2px solid var(--violet-mid);outline-offset:2px;border-radius:4px}
.foot-note{font-size:11.5px;color:#8a8295;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
.hint{font-size:13px;color:#8a8295;margin-top:6px}
.facet-act{padding:8px 0 6px;border-bottom:1px solid var(--line)}
.facet-act:last-child{border-bottom:0}
.facet-act.prio{background:#fff6f1;border-left:3px solid var(--orange);padding:8px 10px;border-radius:0 8px 8px 0;margin:6px 0;border-bottom:0}
.fa-head{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.fa-head b{color:var(--ink);font-weight:800}
.prio-badge{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--orange);border-radius:20px;padding:2px 9px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-btn{flex:1 1 0;min-width:150px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:12px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;transition:.12s}
.seg-btn:hover{border-color:var(--violet-mid)}
.seg-btn.sel{background:var(--violet);border-color:var(--violet);color:#fff}
.tbrand{font-weight:800;color:#fff;font-size:15.5px;letter-spacing:.01em}
.tbrand .o{color:#e94e1b}
.brandtitle{font-size:34px;font-weight:800;color:var(--violet);margin:26px 0 4px;letter-spacing:-.01em}
.brandtitle .o{color:#e94e1b}
.wheel-cap{font-size:12px;color:#8a8295;margin-top:6px;text-align:center}
.cloture{background:var(--violet-soft);border-left:4px solid var(--violet);border-radius:0 10px 10px 0;
  padding:14px 16px;margin:16px 0;font-size:14px;color:var(--ink);font-style:italic}
.cross-item{border-left:3px solid var(--violet);background:var(--violet-soft);border-radius:0 10px 10px 0;padding:11px 14px;margin:10px 0;font-size:13.5px;line-height:1.65;color:var(--ink)}
.ci-t{font-weight:700;color:var(--violet);margin-bottom:3px}
.dim-legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:6px}
.dim-chip{font-size:12.5px;font-weight:700;color:var(--ink)}
.dim-chip b{color:var(--violet)}
.print-frame{width:100%;border-collapse:collapse}
.print-frame>tbody>tr>td,.print-frame>tfoot>tr>td{padding:0;border:0}
.legal-footer{text-align:center;font-size:9.5px;color:#8a8295;margin-top:22px;border-top:1px solid var(--line);padding-top:8px}
.roster-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.roster-row:last-child{border-bottom:0}
.rn{font-weight:700;color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:13px}
.rn-input{font-size:13px;padding:6px 8px;flex:0 1 240px;min-width:120px}
.send-help{background:var(--gris-soft);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:13px;color:#4a4254;line-height:1.7}
.plan-row{display:grid;grid-template-columns:1fr 130px;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;align-items:start}
.plan-row:last-child{border-bottom:0}
.plan-act,.plan-when{font-size:13.5px;min-height:20px}
.plan-when{color:var(--violet);font-weight:700}
[contenteditable][data-ph]:empty:before{content:attr(data-ph);color:#b7b1c0;font-weight:400}
.hidden{display:none!important}
@media print{
  body{background:#fff}
  .topbar,.no-print{display:none!important}
  .wrap{max-width:100%;padding:0}
  .card{border:0;box-shadow:none;padding:0;margin:10px 0}
  .genrow,.bar,.tag{break-inside:avoid}
  h2{break-after:avoid}
  .global{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar .fill,.scale-dot,.pill,.tag,.prio-badge,.facet-act.prio{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .facet-act,.bgroup{break-inside:avoid}
  .print-frame tfoot{display:table-footer-group}
  .legal-footer{margin-top:0;padding:6px 0;font-size:8.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:12mm 12mm 14mm}
}
</style>
</head>

const DATA = {"scales":[{"id":"PS","name":"Perception de soi","color":"#48235C","desc":"La façon dont vous vous connaissez, vous estimez et accueillez vos émotions."},{"id":"EI","name":"Expression individuelle","color":"#e94e1b","desc":"Votre capacité à exprimer vos émotions, à vous affirmer et à agir avec autonomie."},{"id":"RH","name":"Relations humaines","color":"#8e5fa8","desc":"La qualité de vos liens, votre écoute et votre engagement envers le collectif."},{"id":"PD","name":"Prise de décision","color":"#c4622e","desc":"Votre manière de résoudre les problèmes, de rester objectif et de maîtriser vos impulsions."},{"id":"GS","name":"Gestion du stress","color":"#6f6b78","desc":"Votre aptitude à vous adapter, à absorber la pression et à garder un regard positif."}],"facets":[{"id":0,"s":"PS","name":"Amour-propre","items":["Quand je repense à une réussite, je m'en attribue ma part sans la minimiser.","Quand je fais une erreur, je reste bienveillant envers moi plutôt que de m'accabler.","Devant une réussite, je pense d'abord à ce que j'aurais pu faire mieux."],"generic":"L'estime que vous vous portez et la bienveillance que vous vous accordez.","strength":"Vous vous estimez à votre juste valeur et vous vous accordez de la bienveillance, ce qui vous donne une base solide pour agir.","dev":"Renforcer la reconnaissance de vos propres qualités consoliderait votre assise personnelle.","actions":["Notez chaque semaine trois réussites, même modestes, pour ancrer vos acquis.","Au calme, remémorez-vous une réussite récente et ce qu'elle dit de vos qualités.","Demandez à un proche de confiance ce qu'il apprécie chez vous, et accueillez sa réponse."],"actions_soin":["Après une situation difficile, parlez-vous comme à un collègue que vous soutiendriez.","En fin de poste, notez un geste de soin que vous avez bien mené et ce qu'il dit de vous.","Demandez à un collègue de confiance un retour sur un point fort qu'il observe chez vous."]},{"id":1,"s":"PS","name":"Réalisation de soi","items":["Ce que je fais au quotidien a du sens à mes yeux.","Je me fixe des buts qui m'engagent vraiment, au-delà de ce qu'on attend de moi.","Apprendre quelque chose de neuf me met en mouvement, même en dehors du travail."],"generic":"Votre élan à progresser et à donner du sens à ce que vous faites.","strength":"Vous cherchez à grandir et à donner du sens à votre action, ce qui nourrit une motivation durable.","dev":"Clarifier ce qui compte vraiment pour vous redonnerait de l'élan à votre quotidien.","actions":["Écrivez un objectif qui vous tient à cœur pour les trois mois à venir, et sa première étape.","Choisissez une compétence qui vous motive et inscrivez-vous à une formation courte.","Échangez avec votre manager sur une mission qui aurait du sens pour vous."],"actions_soin":["Reliez une tâche routinière au sens qu'elle a pour les patients, et redites-le-vous.","Choisissez un domaine du soin à approfondir et repérez une formation ou un compagnonnage.","Échangez avec votre cadre sur une mission ou un projet qui aurait du sens pour vous."]},{"id":2,"s":"PS","name":"Conscience de soi émotionnelle","items":["Sur le moment, je sais mettre un mot sur ce qui monte en moi.","Je fais le lien entre une réaction vive et ce qui l'a déclenchée.","Je perçois des nuances dans ce que je ressens, au-delà de « ça va » ou « ça va mal »."],"generic":"Votre capacité à repérer et comprendre vos propres émotions.","strength":"Vous identifiez vite ce que vous ressentez et ce qui le déclenche, un atout pour vous ajuster avec justesse.","dev":"Affiner la lecture de vos émotions vous aiderait à mieux anticiper vos réactions.","actions":["En fin de journée, prenez deux minutes d'écoute de soi pour nommer l'émotion dominante et son déclencheur.","Tenez une liste des situations qui réveillent le plus vos émotions.","Repérez la sensation physique qui accompagne vos émotions, par exemple la gorge serrée ou le ventre noué."],"actions_soin":["Après une prise en charge éprouvante, prenez deux minutes d'écoute de soi pour nommer ce que vous ressentez.","Tenez une liste des situations de service qui réveillent le plus vos émotions.","Repérez la sensation physique qui monte en service, par exemple la gorge serrée, comme signal d'alerte."]},{"id":3,"s":"EI","name":"Expression émotionnelle","items":["Quand une émotion compte, je la dis plutôt que de la garder pour moi.","Je fais part de mon ressenti à la personne concernée, au bon moment.","Je trouve les mots justes pour exprimer ce qui m'anime, même quand c'est délicat."],"generic":"La clarté avec laquelle vous exprimez ce que vous ressentez.","strength":"Vous exprimez vos émotions de façon claire et appropriée, ce qui fluidifie vos échanges.","dev":"Oser partager davantage vos ressentis renforcerait la qualité de vos relations.","actions":["Choisissez une situation cette semaine pour dire calmement une émotion utile à la personne concernée.","Entraînez-vous à formuler un ressenti avec « je » auprès d'un binôme de confiance.","Écrivez ce que vous ressentez avant un échange délicat, pour clarifier ce que vous voulez dire."],"actions_soin":["Lors d'un temps d'équipe ou d'un débriefing, partagez calmement un ressenti lié à une situation de soin.","Préparez une phrase simple pour dire à un collègue ce qu'une prise en charge a réveillé en vous.","Écrivez ce que vous ressentez après un poste marquant, pour mettre des mots avant d'en parler."]},{"id":4,"s":"EI","name":"Affirmation de soi","items":["Quand je suis en désaccord, je le dis posément plutôt que de laisser passer.","Je pose une limite claire tout en gardant le lien avec l'autre.","Pour préserver l'ambiance, je garde mes désaccords pour moi."],"generic":"Votre aptitude à défendre vos idées et à poser vos limites avec respect.","strength":"Vous défendez votre point de vue avec calme et fermeté tout en respectant l'autre.","dev":"Affirmer vos positions plus tôt dans l'échange gagnerait à devenir un réflexe.","actions":["Préparez et répétez à voix haute une phrase d'ancrage : « voici ma position, et voici pourquoi ».","Identifiez une limite à poser cette semaine et formulez-la simplement à la personne concernée.","Observez une personne qui s'affirme avec calme et repérez une formule à reprendre."],"actions_soin":["En réunion de service, énoncez clairement votre observation sur un patient et ce que vous préconisez.","Posez une limite de charge avant la saturation et formulez-la simplement à votre cadre.","Repérez chez un collègue qui s'affirme avec calme une formule à reprendre."]},{"id":5,"s":"EI","name":"Indépendance","items":["Face à un choix, je m'appuie d'abord sur mon jugement avant de consulter.","J'avance sur mes tâches en gardant la main, sans attendre qu'on me guide à chaque étape.","Je tiens une décision réfléchie même quand elle déplaît autour de moi."],"generic":"Votre capacité à décider et à agir en vous appuyant sur votre propre jugement.","strength":"Vous décidez et avancez de façon autonome, en assumant vos choix.","dev":"Vous appuyer davantage sur votre propre jugement renforcerait votre autonomie.","actions":["Avant de demander un avis, posez d'abord votre propre analyse par écrit.","Prenez une décision courante de la semaine en vous fiant à votre seul jugement, puis observez le résultat.","Dans un moment au calme, mettez à plat un choix à venir en vous appuyant sur vos propres critères."],"actions_soin":["Appuyez-vous sur votre évaluation clinique pour proposer une conduite, puis confrontez-la à l'équipe.","Pour une décision de votre périmètre, fiez-vous d'abord à votre jugement professionnel.","Après une décision prise en autonomie, prenez un temps de recul sur ce qui a bien fonctionné."]},{"id":6,"s":"RH","name":"Relations humaines","items":["Avec le temps, les personnes de mon entourage m'accordent leur confiance.","Dans un groupe nouveau, je crée assez vite un lien sincère.","Nouer une relation de confiance me demande beaucoup de temps."],"generic":"La qualité et la solidité des liens que vous tissez.","strength":"Vous nouez des relations de confiance et restez disponible pour les autres.","dev":"Investir un peu plus de temps relationnel consoliderait votre réseau d'appui.","actions":["Proposez un café ou un déjeuner à un collègue cette semaine.","Reprenez contact avec une personne que vous appréciez et avez peu vue.","Accordez chaque jour quelques minutes à un échange sincère, sans but utilitaire."],"actions_soin":["Prenez cinq minutes par poste pour un échange sincère avec un collègue du service.","Soignez le lien avec les autres métiers du parcours patient : brancardage, secrétariat, pharmacie.","Adressez un mot de reconnaissance à un collègue qui vous a soutenu."]},{"id":7,"s":"RH","name":"Empathie","items":["Je perçois l'état d'un proche avant même qu'il l'exprime.","Avant de trancher, je me mets à la place de ceux que la décision touche.","J'ajuste ma façon de parler à l'émotion de mon interlocuteur."],"generic":"Votre sensibilité à ce que vivent et ressentent les autres.","strength":"Vous percevez finement l'état des autres et vous y ajustez.","dev":"Vérifier votre lecture de l'autre par une question ouverte affinerait votre empathie.","actions":["Avant de répondre, reformulez ce que l'autre semble ressentir pour le valider.","Posez une question ouverte du type « comment vis-tu cette situation ? » et écoutez sans interrompre.","Discutez avec une personne au vécu différent du vôtre et cherchez à comprendre son ressenti."],"actions_soin":["Avant de répondre à un patient inquiet, reformulez ce qu'il semble ressentir pour le valider.","Auprès d'un proche éprouvé, posez une question ouverte sur ce qu'il traverse et écoutez.","En équipe, cherchez le besoin d'un collègue tendu derrière sa réaction."]},{"id":8,"s":"RH","name":"Responsabilité sociale","items":["Quand l'équipe a besoin d'un coup de main, je m'y implique sans qu'on me le demande.","Je tiens compte de l'intérêt du collectif, même quand cela me coûte un effort.","Je tiens mes engagements envers le aits.","Je fais la part entre ce que je crois et ce qui est établi.","J'ajuste mes attentes à ce qui est réellement possible, même quand j'espère davantage."],"generic":"Votre lucidité à évaluer les situations à partir des faits.","strength":"Vous évaluez les situations avec lucidité et distinguez les faits de vos impressions.","dev":"Confronter vos impressions aux faits renforcerait votre objectivité.","actions":["Avant de conclure, demandez-vous « quels faits soutiennent cette idée ? » et cherchez-en un contraire.","Confrontez votre lecture d'une situation à l'avis d'une personne extérieure.","Sur un sujet sensible, écrivez d'un côté les faits, de l'autre vos interprétations."],"actions_soin":["Sur une situation patient sensible, distinguez par écrit les faits cliniques de vos interprétations.","Avant de conclure, demandez-vous quels éléments objectifs soutiennent votre lecture.","Croisez votre observation avec celle d'un collègue pour valider une évaluation importante."]},{"id":11,"s":"PD","name":"Contrôle des impulsions","items":["Avant de répondre à chaud, je me laisse un temps de respiration.","Dans l'urgence, je garde la tête froide plutôt que d'agir dans la précipitation.","Quand quelque chose me contrarie, je réagis dans l'instant."],"generic":"Votre capacité à réfléchir avant d'agir et à garder votre sang-froid.","strength":"Vous prenez le temps de réfléchir et gardez votre sang-froid dans l'urgence.","dev":"Marquer une pause avant de réagir à chaud renforcerait votre maîtrise.","actions":["Avant de réagir, marquez une pause : respirez lentement deux ou trois fois, puis répondez.","Différez d'une heure l'envoi d'un message écrit sous le coup de l'émotion, puis relisez-le.","Pratiquez régulièrement une activité physique qui vous plaît, marche, sport, danse ou jardinage, pour évacuer la tension et gagner en recul."],"actions_soin":["Face à une urgence, marquez une pause : respirez lentement deux ou trois fois, puis agissez.","Une application de cohérence cardiaque, sur une pause, peut vous aider à retrouver votre calme.","Après une émotion forte, différez une réponse à chaud à un patient ou à un collègue."]},{"id":12,"s":"GS","name":"Flexibilité","items":["Quand un imprévu bouscule mon plan, je me réorganise plutôt que de m'y accrocher.","Un changement de cap m'apparaît d'abord comme une occasion d'ajuster.","Je révise ma manière de faire dès que la situation le réclame."],"generic":"Votre aisance à vous adapter aux imprévus et au changement.","strength":"Vous vous adaptez avec aisance et révisez votre façon de faire au besoin.","dev":"Accueillir le changement comme une occasion d'ajustement développerait votre souplesse.","actions":["Face à un imprévu, formulez une option B avant de réagir.","Testez une nouvelle façon de faire sur une tâche habituelle cette semaine.","Demandez à un collègue sa méthode et essayez-la une fois pour comparer."],"actions_soin":["Face à un imprévu de service, formulez une option de repli avant de réagir.","Testez une organisation différente sur une tâche récurrente du poste.","Demandez à un collègue sa façon de gérer une situation et essayez-la une fois."]},{"id":13,"s":"GS","name":"Tolérance au stress","items":["Sous pression, je reste capable de faire ce que j'ai à faire.","Dans une période tendue, je retrouve mon équilibre assez vite.","Quand la pression monte, elle me gagne rapidement."],"generic":"Votre aptitude à rester efficace et équilibré sous pression.","strength":"Vous restez efficace sous pression et récupérez vite après une tension.","dev":"Installer des temps de récupération soutiendrait votre équilibre dans la durée.","actions":["Repérez vos premiers signaux de tension et associez-leur une micro-pause de deux minutes.","Marchez quelques minutes dehors, au contact de la nature, pour relâcher la pression.","Une application de cohérence cardiaque peut vous aider à réguler avant un moment exigeant."],"actions_soin":["Repérez vos premiers signaux de tension en poste et associez-leur une micro-pause.","Sur une pause, marchez quelques minutes dehors, au contact de l'air et de la nature, pour relâcher.","Pratiquez régulièrement, hors travail, une activité physique qui vous plaît, marche, sport, danse ou jardinage, pour évacuer la tension et récupérer."]},{"id":14,"s":"GS","name":"Optimisme","items":["Même dans l'adversité, je garde l'idée qu'une issue est possible.","Dans une situation difficile, je repère aussi ce sur quoi m'appuyer.","J'aborde un défi avec une énergie qui me porte vers l'avant."],"generic":"Votre regard confiant et constructif sur l'avenir.","strength":"Vous gardez confiance et voyez le côté constructif des situations.","dev":"Cultiver des points d'appui positifs renforcerait votre élan dans l'adversité.","actions":["En fin de journée, notez un fait positif et ce qu'il rend possible pour la suite.","Accordez-vous un temps de contemplation, un paysage, le ciel, pour reprendre du recul.","Face à un revers, formulez avec un proche l'enseignement à en tirer."],"actions_soin":["En fin de poste, repérez une prise en charge qui s'est bien passée et ce qu'elle rend possible.","Accordez-vous un temps de contemplation au calme, dehors si possible, pour reprendre du recul.","Face à un revers, formulez avec un collègue l'enseignement à en tirer pour la prochaine fois."]}],"anchors":["Rarement","De temps en temps","Souvent","Très souvent","Presque toujours"],"bands":[{"max":39,"label":"À consolider"},{"max":59,"label":"En développement"},{"max":79,"label":"Appui solide"},{"max":100,"label":"Point d'appui majeur"}],"reverse":[2,14,20,35,41]};
const SCALES = DATA.scales, FACETS = DATA.facets, ANCHORS = DATA.anchors, BANDS = DATA.bands;
const REV = new Set(DATA.reverse||[]);

function getParam(n){const hay=(location.search||'')+'&'+((location.hash||'').replace(/^#/,'&'));const m=hay.match(new RegExp('[?&]'+n+'=([^&]+)'));return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}

function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function bandFor(score){for(const b of BANDS){if(score<=b.max)return b.label;}return BANDS[BANDS.length-1].label;}
function facetScore(a,i){const b=i*3;const iv=k=>{const idx=b+k;return REV.has(idx)?(6-a[idx]):a[idx];};const m=(iv(0)+iv(1)+iv(2))/3;return ((m-1)/4)*100;}
function scaleScore(a,sid){const fs=FACETS.filter(f=>f.s===sid);const v=fs.reduce((x,f)=>x+facetScore(a,f.id),0)/fs.length;return v;}
function globalScore(a){const v=SCALES.reduce((x,s)=>x+scaleScore(a,s.id),0)/SCALES.length;return v;}
function crossReadings(a){
  const dim=SCALES.map(s=>({s,v:scaleScore(a,s.id)}));
  const fv={};for(let i=0;i<15;i++)fv[i]=facetScore(a,i);
  const HI=62,LO=45;const msgs=[];
  const ds=[...dim].sort((x,y)=>y.v-x.v);const top=ds[0],bot=ds[ds.length-1];const ecart=top.v-bot.v;
  if(ecart>=22){msgs.push({t:'Un profil contrasté',x:'« '+top.s.name+' » vous porte nettement plus que « '+bot.s.name+' », avec un écart marqué. Cet écart est une information précieuse : il montre où vous puisez votre énergie, et le terrain où un appui reste à consolider.'});}
  else if(ecart<=11){msgs.push({t:'Un profil homogène',x:'Vos cinq dimensions se tiennent dans un mouchoir. Cette régularité offre une assise stable ; veillez à cultiver vos reliefs, car les appuis les plus francs sont aussi vos leviers les plus mobilisables.'});}
  const pairs=[
    {hi:4,lo:11,t:"S'affirmer sans se laisser emporter",x:"Vous savez vous affirmer, mais la réaction à chaud peut en effacer le bénéfice. Votre affirmation gagne à s'accompagner d'un court temps de recul avant de répondre."},

    {hi:8,lo:0,t:'Le collectif, sans vous oublier',x:'Votre sens des responsabilités envers le groupe est net, tandis que le regard porté sur votre propre valeur reste plus discret. Nourrir le second soutient le premier.'},
    {hi:9,lo:12,t:'La rigueur, sans la rigidité',x:"Votre capacité d'analyse est solide. Elle gagne à laisser une porte ouverte à d'autres voies quand le contexte se dérobe."},
    {hi:14,lo:10,t:'Un élan à ancrer dans les faits',x:'Votre optimisme est un moteur. Adossé à une lecture lucide des réalités, il entraîne sans survoler.'},
    {hi:10,lo:14,t:"La lucidité, ouverte à l'espérance",x:"Votre sens des réalités est aiguisé. Lui laisser une place pour l'optimisme aide à tenir l'effort dans la durée."},
    {hi:5,lo:6,t:"L'autonomie, reliée aux autres",x:'Votre indépendance est une force. Veillez à ce qu\'elle vous garde relié aux appuis collectifs, qui allègent et enrichissent.'},
    {hi:2,lo:3,t:'Ressentir, et laisser paraître',x:'Vous percevez finement vos émotions, et vous les exprimez peu. Nommer ce que vous ressentez, au bon moment, renforce vos liens et votre justesse.'}
  ];
  let n=0;for(const p of pairs){if(n>=2)break;if(fv[p.hi]>=HI&&fv[p.lo]<=LO){msgs.push({t:p.t,x:p.x});n++;}}
  if(msgs.length<3&&fv[13]<=LO&&fv[11]<=LO){msgs.push({t:'Sous pression, un point de vigilance',x:'Quand la tension monte, la tolérance au stress et le contrôle des impulsions sont sollicités ensemble. Un rituel simple de retour au calme, préparé à froid, fait ici une vraie différence.'});}
  if(msgs.length<3){const ps=dim.find(d=>d.s.id==='PS');if(ps&&ps.v<55&&bot.s.id==='PS'){msgs.push({t:'Un socle à renforcer',x:"La perception de soi est le socle sur lequel s'appuient les autres dimensions. La consolider profite à l'ensemble de votre intelligence émotionnelle."});}}
  return msgs.slice(0,3);
}

/* ---------- encode / decode (carries context: 0 soin, 1 hors) ---------- */
function encode(a, ctx){
  let v=1n;
  v=v*2n+BigInt(ctx);
  for(const x of a){v=v*5n+BigInt(x-1);}
  let s=v.toString(36).toUpperCase();
  let sum=(a.reduce((x,y)=>x+y,0)+ctx)%1296;
  let cs=sum.toString(36).toUpperCase().padStart(2,'0');
  let full=s+cs;
  return full.match(/.{1,4}/g).join('-');
}
function decode(code){
  let c=(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(c.length<3)return null;
  let cs=c.slice(-2), payload=c.slice(0,-2);
  let v=0n;
  for(const ch of payload){let d=parseInt(ch,36);if(isNaN(d))return null;v=v*36n+BigInt(d);}
  let digits=[];
  for(let i=0;i<45;i++){digits.push(Number(v%5n));v=v/5n;}
  let ctx=Number(v%2n);v=v/2n;
  if(v!==1n)return null;
  if(ctx!==0&&ctx!==1)return null;
  digits.reverse();
  let a=digits.map(d=>d+1);
  if(a.some(x=>x<1||x>5))return null;
  let sum=(a.reduce((x,y)=>x+y,0)+ctx)%1296;
  if(sum.toString(36).toUpperCase().padStart(2,'0')!==cs)return null;
  return {a:a, ctx:ctx};
}

        ANCHORS.forEach((an,ai)=>{

          o.innerHTML=`<b>${ai+1}</b>${esc(an)}`;

function updateProgress(){
  const n=answers.filter(x=>x!==null).length;

  if(go){const ok=n===45&&nameOk&&userCtx!==null;go.disabled=!ok;go.style.opacity=ok?1:.5;}
}

/* ---------- radar ---------- */
function wrapLabel(name){
  const w=name.split(' ');if(name.length<=14)return [name];
  let l1='',l2='';for(const x of w){if((l1+' '+x).trim().length<=14&&!l2)l1=(l1+' '+x).trim();else l2=(l2+' '+x).trim();}
  return l2?[l1,l2]:[l1];
}
function radarSVG(vals){
  const cx=270,cy=248,R=158,N=5;
  const ang=i=>(-90+i*72)*Math.PI/180;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let g='';
  [0.25,0.5,0.75,1].forEach(fr=>{
    const p=vals.map((_,i)=>pt(i,R*fr).map(n=>n.toFixed(1)).join(',')).join(' ');
    g+=`<polygon points="${p}" fill="${fr===1?'#fff':'none'}" stroke="#e4e0e8" stroke-width="1"/>`;
  });
  for(let i=0;i<N;i++){const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e4e0e8" stroke-width="1"/>`;}
  const dp=vals.map((v,i)=>pt(i,R*v.score/100).map(n=>n.toFixed(1)).join(',')).join(' ');
  g+=`<polygon points="${dp}" fill="rgba(72,35,92,0.16)" stroke="#48235C" stroke-width="2.5" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{const[x,y]=pt(i,R*v.score/100);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#e94e1b"/>`;});
  vals.forEach((v,i)=>{
    const[x,y]=pt(i,R+24);
    const anchor=Math.abs(x-cx)<6?'middle':(x>cx?'start':'end');
    const lines=wrapLabel(v.name);
    const up=y<cy;
    const dy0=up?-((lines.length)*14):0;
    let tsp=lines.map((ln,k)=>`<tspan x="${x.toFixed(1)}" dy="${k===0?dy0:14}">${esc(ln)}</tspan>`).join('');
    g+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="#48235C">${tsp}<tspan x="${x.toFixed(1)}" dy="15" font-size="12.5" font-weight="800" fill="#e94e1b">${Math.round(v.score)}</tspan></text>`;
  });
  return `<svg viewBox="0 0 540 470" xmlns="http://www.w3.org/2000/svg" class="radar" role="img" aria-label="Radar des cinq dimensions">${g}</svg>`;
}

/* ---------- segmented wheel (5 dimensions x 3 composantes) ---------- */
function hexLighten(hex,amt){
  const c=hex.replace('#','');
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  const m=v=>Math.round(v+(255-v)*amt);const h=v=>v.toString(16).padStart(2,'0');
  return '#'+h(m(r))+h(m(g))+h(m(b));
}
function pol(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function annSector(cx,cy,ri,ro,a0,a1){
  const [xo0,yo0]=pol(cx,cy,ro,a0),[xo1,yo1]=pol(cx,cy,ro,a1);
  const [xi1,yi1]=pol(cx,cy,ri,a1),[xi0,yi0]=pol(cx,cy,ri,a0);
  const large=(a1-a0)>180?1:0;
  return `M ${xo0.toFixed(2)} ${yo0.toFixed(2)} A ${ro} ${ro} 0 ${large} 1 ${xo1.toFixed(2)} ${yo1.toFixed(2)} L ${xi1.toFixed(2)} ${yi1.toFixed(2)} A ${ri} ${ri} 0 ${large} 0 ${xi0.toFixed(2)} ${yi0.toFixed(2)} Z`;
}
function wheelSVG(a){
  const cx=360,cy=340,r0=58,R=148,gap=1.4;
  let g='';
  [0.25,0.5,0.75,1].forEach(fr=>{const r=(r0+(R-r0)*fr).toFixed(1);g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e4e0e8" stroke-width="1"/>`;});
  FACETS.forEach((f,gi)=>{
    const d=Math.floor(gi/3), j=gi%3, col=SCALES[d].color;
    const a0=gi*24+gap/2, a1=(gi+1)*24-gap/2;
    const v=facetScore(a,f.id);
    const rOut=r0+(R-r0)*v/100;
    const shade=hexLighten(col, j===0?0:(j===1?0.24:0.46));
    g+=`<path d="${annSector(cx,cy,r0,R,a0,a1)}" fill="${col}" opacity="0.08"/>`;
    g+=`<path d="${annSector(cx,cy,r0,rOut,a0,a1)}" fill="${shade}"/>`;
  });
  FACETS.forEach((f,gi)=>{
    const mid=gi*24+12;
    const [lx,ly]=pol(cx,cy,R+7,mid);
    const left=mid>180;
    const rot=left?(mid+90):(mid-90);
    const anchor=left?'end':'start';
    g+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})" text-anchor="${anchor}" font-size="9.5" font-weight="600" fill="#4a4254" dominant-baseline="central">${esc(f.name)} · ${Math.round(facetScore(a,f.id))}</text>`;
  });
  const gs=Math.round(globalScore(a));
  g+=`<circle cx="${cx}" cy="${cy}" r="${r0-3}" fill="#fff" stroke="#e4e0e8" stroke-width="1"/>`;
  g+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="32" font-weight="800" fill="#48235C">${gs}</text>`;
  g+=`<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="11" font-weight="700" fill="#6a6175">indice global</text>`;
  return `<svg viewBox="0 0 720 710" xmlns="http://www.w3.org/2000/svg" class="radar" role="img" aria-label="Roue Émopreinte des composantes">${g}</svg>`;
}

/* ---------- report ---------- */

  const gen=document.createElement('div');gen.className='card';

      <b style="color:${s.color}">${esc(s.name)}</b>
      <span class="pill" style="background:${s.color}">${esc(bl)} · ${Math.round(sv)}</span></div>
      <div contenteditable="true">${esc(s.desc)} ${esc(BAND_SENT[bl])}</div>`;
    gen.appendChild(row);
  });
  container.appendChild(gen);

  const bars=document.createElement('div');bars.className='card bars';
  bars.innerHTML=`<h2 style="margin-top:6px">Le détail des quinze composantes</h2>`;
  SCALES.forEach(s=>{
    const grp=document.createElement('div');grp.className='bgroup';
    grp.innerHTML=`<div class="bgh"><span class="scale-dot" style="background:${s.color}"></span>${esc(s.name)}</div>`;
    FACETS.filter(f=>f.s===s.id).forEach((f,j)=>{
      const v=facetScore(a,f.id);
      const reading=v>=60?f.strength:f.dev;
      const shade=hexLighten(s.color, j===0?0:(j===1?0.24:0.46));
      const b=document.createElement('div');b.className='bar';
      b.innerHTML=`<div class="bl"><span class="sw" style="background:${shade}"></span>${esc(f.name)} <span class="bv">${Math.round(v)} · ${esc(bandFor(v))}</span></div>

        <div class="hint" style="margin-top:3px" contenteditable="true">${esc(reading)}</div>`;

  container.appendChild(bars);

  const fc=document.createElement('div');fc.className='card';
  fc.innerHTML=`<h2 style="margin-top:6px">Vos forces</h2><p class="hint" style="margin-top:0">Les composantes sur lesquelles vous vous appuyez le plus aujourd'hui.</p>`;
  forces.forEach(o=>{
    const t=document.createElement('div');t.className='tag f';
    t.innerHTML=`<span class="nm">${esc(o.f.name)} · ${Math.round(o.score)}</span><span contenteditable="true">${esc(o.f.strength)}</span>`;
    fc.appendChild(t);
  });
  container.appendChild(fc);

  const xr=crossReadings(a);
  if(xr.length){
    const xc=document.createElement('div');xc.className='card';
    xc.innerHTML=`<h2 style="margin-top:6px">Lectures croisées</h2><p class="hint" style="margin-top:0">La richesse d'un profil se lit autant dans le dialogue entre les dimensions que dans chaque score pris à part. Ces éclairages tiennent compte de la façon dont vos appuis se répondent. Ils décrivent votre perception d'aujourd'hui ; d'autres regards, autour de vous, pourraient en nuancer certains, matière précieuse pour la réflexion.</p>`;

  const prioIds=new Set(axes.map(o=>o.f.id));
  const pa=document.createElement('div');pa.className='card';
  pa.innerHTML=`<h2 style="margin-top:6px">Pistes d'action par composante</h2><p class="hint" style="margin-top:0">Des actions concrètes pour chacune des quinze composantes. Celles marquées « priorité » sont les leviers les plus porteurs à ce stade.</p>`;
  SCALES.forEach(s=>{
    const grp=document.createElement('div');grp.className='bgroup';
    grp.innerHTML=`<div class="bgh"><span class="scale-dot" style="background:${s.color}"></span>${esc(s.name)}</div>`;
    FACETS.filter(f=>f.s===s.id).forEach(f=>{
      const v=facetScore(a,f.id);const prio=prioIds.has(f.id);
      const block=document.createElement('div');block.className='facet-act'+(prio?' prio':'');
      const badge=prio?`<span class="prio-badge">priorité</span>`:'';
      block.innerHTML=`<div class="fa-head"><b>${esc(f.name)}</b> <span class="bv">${Math.round(v)} · ${esc(bandFor(v))}</span>${badge}</div>`;
      const ul=document.createElement('ul');ul.className='actions-list';
      const acts=(ctx===0?f.actions_soin:f.actions);
      acts.forEach(act=>{const li=document.createElement('li');li.contentEditable='true';li.textContent=act;ul.appendChild(li);});
      block.appendChild(ul);
      grp.appendChild(block);
    });
    pa.appendChild(grp);
  });
  container.appendChild(pa);

  const plan=document.createElement('div');plan.className='card';
  plan.innerHTML=`<h2 style="margin-top:6px">Mon plan d'action</h2><p class="hint" style="margin-top:0">Ces trois pistes sont issues de vos composantes prioritaires, celles aux scores les plus bas. Retenez-en deux ou trois et fixez une échéance. À compléter ou modifier librement.</p>`;
  const seeds=axes.slice(0,3).map(o=>(ctx===0?o.f.actions_soin:o.f.actions)[0]);
  for(let i=0;i<3;i++){
    const prow=document.createElement('div');prow.className='plan-row';
    prow.innerHTML=`<div class="plan-act" contenteditable="true" data-ph="Action retenue">${esc(seeds[i]||'')}</div>`+
      `<div class="plan-when" contenteditable="true" data-ph="Échéance"></div>`;
    plan.appendChild(prow);
  }
  container.appendChild(plan);
}

function reportFrame(contentNode,breakBefore){
  const t=document.createElement('table');t.className='print-frame';
  if(breakBefore)t.style.pageBreakBefore='always';
  const tf=document.createElement('tfoot');const tr1=document.createElement('tr');const td1=document.createElement('td');
  const f=document.createElement('div');f.className='legal-footer';f.textContent=LEGAL;
  td1.appendChild(f);tr1.appendChild(td1);tf.appendChild(tr1);
  const tb=document.createElement('tbody');const tr2=document.createElement('tr');const td2=document.createElement('td');
  td2.appendChild(contentNode);tr2.appendChild(td2);tb.appendChild(tr2);
  t.appendChild(tf);t.appendChild(tb);
  return t;
}

function report(a,name,date,ctx,groupe,backFn){
  app.innerHTML='';
  const wrap=document.createElement('div');wrap.className='report-page';
  buildReport(wrap,a,name,date,ctx,groupe);
  app.appendChild(reportFrame(wrap,false));
  const row=document.createElement('div');row.className='btn-row no-print';row.style.marginTop='20px';
  row.innerHTML=`<button class="btn btn-ghost" id="rep-back">Retour</button>
    <button class="btn btn-primary" id="rep-print">Imprimer / Enregistrer en PDF</button>`;
  app.appendChild(row);
  document.getElementById('rep-back').onclick=()=>{if(backFn){backFn();}else{go(restitution);}};
  document.getElementById('rep-print').onclick=()=>window.print();
}

/* ---------- tableau de bord par groupe ---------- */
const ROSTER_KEY='emopreinte_roster_v1';
function loadRoster(){try{return JSON.parse(localStorage.getItem(ROSTER_KEY))||[];}catch(e){return [];}}
function saveRoster(r){try{localStorage.setItem(ROSTER_KEY,JSON.stringify(r));}catch(e){}}
function parseBlocks(raw){
  const out=[];const seen=new Set();
  const codeRe=/\[CODE\]\s*([0-9A-Za-z]{2,4}(?:-[0-9A-Za-z]{2,4}){3,6})/g;let m;
  while((m=codeRe.exec(raw))){
    const before=raw.slice(0,m.index);
    const noms=[...before.matchAll(/\[NOM\]\s*([^\n\r]+)/g)];
    const grps=[...before.matchAll(/\[GROUPE\]\s*([^\n\r]+)/g)];
    const dec=decode(m[1]);
    if(dec){const code=m[1].toUpperCase();seen.add(code.replace(/-/g,''));out.push({g:(grps.length?grps[grps.length-1][1].trim():''),nom:(noms.length?noms[noms.length-1][1].trim():''),code:code,ctx:dec.ctx});}
  }
  const anyRe=/([0-9A-Za-z]{2,4}(?:-[0-9A-Za-z]{2,4}){3,6})/g;let mm;
  while((mm=anyRe.exec(raw))){
    const tok=mm[1].toUpperCase();const key=tok.replace(/-/g,'');
    if(seen.has(key))continue;
    const dec=decode(tok);
    if(dec){seen.add(key);out.push({g:'',nom:'',code:tok,ctx:dec.ctx});}
  }
  return out;
}
function printGroup(entries){
  app.innerHTML='';
  const today=new Date().toLocaleDateString('fr-FR',{year:'numeric',month:'long',day:'numeric'});
  let n=0;
  entries.forEach((e)=>{
    const dec=decode(e.code);if(!dec)return;
    const wrap=document.createElement('div');wrap.className='report-page';
    buildReport(wrap,dec.a,e.nom,today,dec.ctx,e.g);
    app.appendChild(reportFrame(wrap,n>0));
    n++;
  });
  const row=document.createElement('div');row.className='btn-row no-print';row.style.marginTop='20px';
  row.innerHTML=`<button class="btn btn-ghost" id="pg-back">Retour</button>
    <button class="btn btn-primary" id="pg-print">Imprimer / Enregistrer en PDF</button>`;
  app.appendChild(row);
  document.getElementById('pg-back').onclick=()=>go(groupe);
  document.getElementById('pg-print').onclick=()=>window.print();
}
function groupe(){
  app.innerHTML='';
  const d=document.createElement('div');
  d.innerHTML=`<h1>Tableau de bord par groupe</h1>
    <p class="lead">Collez les blocs reçus de vos participants, en une fois ou au fil de l'eau. Ils sont mémorisés sur cet ordinateur et regroupés par session.</p>
    <div class="card">
      <div class="field" style="margin-top:0"><label>Blocs reçus (un ou plusieurs)</label>
        <textarea id="rin" placeholder="Collez ici un ou plusieurs e-mails reçus (nom et code)"></textarea></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="g-back">Retour</button>
        <button class="btn btn-violet" id="g-add">Ajouter au tableau de bord</button>
      </div>
      <div id="g-msg" class="hint"></div>
    </div>`;
  app.appendChild(d);
  const list=document.createElement('div');app.appendChild(list);
  function render(){
    const r=loadRoster();list.innerHTML='';
    if(r.length===0){list.innerHTML='<p class="hint">Aucun participant pour le moment.</p>';return;}
    const groups={};r.forEach((e,i)=>{const k=e.g||'Sans groupe';(groups[k]=groups[k]||[]).push({e,i});});
    Object.keys(groups).sort().forEach(gname=>{
      const rows=groups[gname];
      const card=document.createElement('div');card.className='card';
      card.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">${esc(gname)}</h2><span class="hint">${rows.length} participant${rows.length>1?'s':''}</span></div>`;
      const ul=document.createElement('div');ul.style.marginTop='10px';
      rows.forEach(({e,i})=>{
        const item=document.createElement('div');item.className='roster-row';
        const nameIn=document.createElement('input');nameIn.className='txt rn-input';nameIn.value=e.nom||'';nameIn.placeholder='Nom et prénom';
        nameIn.onchange=()=>{const cur=loadRoster();const it=cur.find(x=>x.code===e.code);if(it){it.nom=nameIn.value.trim();saveRoster(cur);}};
        const ctxh=document.createElement('span');ctxh.className='hint';ctxh.textContent=(e.ctx===0?'Soignant·e':'Non soignant·e / support');
        const open=document.createElement('button');open.className='btn btn-ghost btn-sm';open.style.marginLeft='auto';open.textContent='Voir le rapport';
        open.onclick=()=>{const dec=decode(e.code);if(dec)report(dec.a,nameIn.value.trim(),new Date().toLocaleDateString('fr-FR',{year:'numeric',month:'long',day:'numeric'}),dec.ctx,e.g,()=>go(groupe));};
        const del=document.createElement('button');del.className='btn btn-ghost btn-sm';del.textContent='×';del.title='Retirer';
        del.onclick=()=>{const cur=loadRoster();const idx=cur.findIndex(x=>x.code===e.code);if(idx>=0){cur.splice(idx,1);saveRoster(cur);render();}};
        item.appendChild(nameIn);item.appendChild(ctxh);item.appendChild(open);item.appendChild(del);
        ul.appendChild(item);
      });
      card.appendChild(ul);
      const pall=document.createElement('button');pall.className='btn btn-primary no-print';pall.style.marginTop='12px';pall.textContent='Imprimer tous les rapports de ce groupe';
      pall.onclick=()=>printGroup(loadRoster().filter(x=>((x.g||'Sans groupe')===gname)));
      card.appendChild(pall);
      list.appendChild(card);
    });
    const clearBtn=document.createElement('button');clearBtn.className='btn btn-ghost no-print';clearBtn.style.marginTop='8px';clearBtn.textContent='Vider le tableau de bord';
    clearBtn.onclick=()=>{if(confirm('Effacer tous les participants mémorisés ?')){saveRoster([]);render();}};
    list.appendChild(clearBtn);
  }
  document.getElementById('g-back').onclick=()=>go(home);
  document.getElementById('g-add').onclick=()=>{
    const parsed=parseBlocks(document.getElementById('rin').value);
    if(parsed.length===0){document.getElementById('g-msg').innerHTML='<span class="err">Aucun code valide détecté. Vérifiez que vous avez collé les blocs reçus.</span>';return;}
    const cur=loadRoster();const seen=new Set(cur.map(x=>x.code));let added=0;
    parsed.forEach(p=>{if(!seen.has(p.code)){cur.push(p);seen.add(p.code);added++;}});
    saveRoster(cur);
    document.getElementById('rin').value='';
    document.getElementById('g-msg').textContent=added+' participant'+(added>1?'s':'')+' ajouté'+(added>1?'s':'')+(parsed.length-added>0?(', '+(parsed.length-added)+' déjà présent'+((parsed.length-added)>1?'s':'')):'')+'.';
    render();
  };
  render();
}
if(/passer/i.test((location.hash||'')+(location.search||''))){answers=new Array(45).fill(null);go(quiz);}else{home();}
